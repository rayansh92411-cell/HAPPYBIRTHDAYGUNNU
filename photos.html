<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gunnu ♡ Our Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#fff7f0 0,#f9e8df 42%,#f3d7dc 100%);color:#7d3e50;font-family:"Cormorant Garamond",Georgia,serif}.page{max-width:900px;margin:auto;padding:30px 16px 36px}.back{border:0;background:rgba(255,255,255,.65);color:#8a3d57;border-radius:999px;padding:9px 15px;font:600 14px Georgia;box-shadow:0 5px 15px rgba(80,20,40,.1);cursor:pointer}.title{text-align:center;margin:10px 0 4px;font:normal 48px/1 "Great Vibes",cursive;color:#b33f66}.sub{text-align:center;margin:0 0 20px;font-size:17px;font-style:italic}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{margin:0;background:#fffaf6;padding:7px 7px 10px;border-radius:14px;box-shadow:0 8px 22px rgba(80,20,40,.14);transform:rotate(var(--r));cursor:pointer;transition:transform .25s ease}.card:nth-child(1){--r:-1.4deg}.card:nth-child(2){--r:1.2deg}.card:nth-child(3){--r:-.8deg}.card:nth-child(4){--r:1.5deg}.card:nth-child(5){--r:-1deg}.card:nth-child(6){--r:.8deg}.card:nth-child(7){--r:-1.2deg}.card:nth-child(8){--r:1.1deg}.card:nth-child(9){--r:-.6deg}.card:hover{transform:rotate(0) scale(1.025)}.card img{display:block;width:100%;aspect-ratio:1/1.15;object-fit:cover;border-radius:9px}.caption{text-align:center;font-size:14px;margin-top:6px}.lightbox{position:fixed;inset:0;background:rgba(35,10,22,.93);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:14px}.close{position:absolute;right:15px;top:15px;border:0;border-radius:50%;width:40px;height:40px;background:#fff;color:#7d3e50;font-size:25px;cursor:pointer}@media(max-width:600px){.page{padding:20px 10px 25px}.title{font-size:42px}.grid{gap:7px}.card{padding:4px 4px 7px;border-radius:10px}.card img{border-radius:7px}.caption{font-size:11px}}
</style></head><body><main class="page"><button class="back" onclick="location.href='tree.html'">‹ Back</button><h1 class="title">Our Little Memories ♡</h1><p class="sub">Happy Birthday, Gunnu · 9 November</p><section class="grid"><figure class="card" data-src="./photo-01.jpeg"><img src="./photo-01.jpeg" alt="Gunnu memory 1" loading="eager"><figcaption class="caption">A little moment ♡</figcaption></figure><figure class="card" data-src="./photo-02.jpeg"><img src="./photo-02.jpeg" alt="Gunnu memory 2" loading="eager"><figcaption class="caption">A little moment ♡</figcaption></figure><figure class="card" data-src="./photo-03.jpeg"><img src="./photo-03.jpeg" alt="Gunnu memory 3" loading="eager"><figcaption class="caption">A little moment ♡</figcaption></figure><figure class="card" data-src="./photo-04.jpeg"><img src="./photo-04.jpeg" alt="Gunnu memory 4" loading="eager"><figcaption class="caption">A little moment ♡</figcaption></figure><figure class="card" data-src="./photo-05.jpeg"><img src="./photo-05.jpeg" alt="Gunnu memory 5" loading="eager"><figcaption class="caption">A little moment ♡</figcaption></figure><figure class="card" data-src="./photo-06.jpeg"><img src="./photo-06.jpeg" alt="Gunnu memory 6" loading="eager"><figcaption class="caption">A little moment ♡</figcaption></figure><figure class="card" data-src="./photo-07.jpeg"><img src="./photo-07.jpeg" alt="Gunnu memory 7" loading="eager"><figcaption class="caption">A little moment ♡</figcaption></figure><figure class="card" data-src="./photo-08.jpeg"><img src="./photo-08.jpeg" alt="Gunnu memory 8" loading="eager"><figcaption class="caption">A little moment ♡</figcaption></figure><figure class="card" data-src="./photo-09.jpeg"><img src="./photo-09.jpeg" alt="Gunnu memory 9" loading="eager"><figcaption class="caption">A little moment ♡</figcaption></figure></section></main><div class="lightbox" id="lb"><button class="close" id="close">×</button><img id="big" alt="Gunnu memory"></div><script>const lb=document.getElementById('lb'),big=document.getElementById('big');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{big.src=c.dataset.src;lb.classList.add('open')});document.getElementById('close').onclick=()=>lb.classList.remove('open');lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};</script></body></html>
